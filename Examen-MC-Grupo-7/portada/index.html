<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <meta name="description" content="Explora una visualización 3D de un púlsar y accede al clasificador de candidatos HTRU2.">
  <title>HTRU2 · La señal de un púlsar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305080e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%236bb4ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="universe" aria-label="Visualización artística interactiva de un púlsar azul en el espacio" role="img"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="site-header interface">
    <a class="brand" href="./" aria-label="HTRU2, inicio"><span class="brand-symbol" aria-hidden="true"></span>HTRU2</a>
    <a class="header-link" href="https://htru2.bananacorp.dev/">Abrir clasificador <span aria-hidden="true">↗</span></a>
  </header>

  <main class="intro interface">
    <h1>La señal<br>de un púlsar<span class="title-dot">.</span></h1>
    <p>Explora la clasificación de candidatos a púlsar<br class="desktop-break"> a partir de los datos de HTRU2.</p>
    <a class="primary-link" href="https://htru2.bananacorp.dev/">Entrar al clasificador <span aria-hidden="true">↗</span></a>
  </main>

  <footer class="scene-footer">
    <div class="scene-controls">
      <button id="presentation" type="button" aria-pressed="false">Modo exposición <span aria-hidden="true">⛶</span></button>
      <button id="pause" type="button" aria-pressed="false">Pausar animación</button>
    </div>
    <span class="drag-hint interface">Arrastra para explorar</span>
    <span class="art-label interface">Visualización artística</span>
  </footer>
  <button id="exit-presentation" type="button" hidden>Salir de exposición <span aria-hidden="true">↙</span></button>
  <p id="scene-status" class="scene-status" role="status">Preparando el universo…</p>
  <script type="module" src="escena.js"></script>
</body>
</html>
